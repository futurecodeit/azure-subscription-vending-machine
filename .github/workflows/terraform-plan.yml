name: Azure Subscription Vending - Terraform Plan

on:
  workflow_dispatch:
    inputs:
      requestId:
        description: Subscription vending request ID
        required: true
        type: string
      projectName:
        description: Project or application name
        required: true
        type: string
      environment:
        description: Environment
        required: true
        type: string
      managementGroupId:
        description: Management Group ID
        required: true
        type: string
      billingScopeId:
        description: Billing scope ID
        required: true
        type: string
      region:
        description: Azure region
        required: true
        type: string
      tenantId:
        description: Tenant ID
        required: true
        type: string
      businessUnit:
        description: Business unit
        required: false
        type: string
      businessOwner:
        description: Business owner
        required: false
        type: string
      technicalOwner:
        description: Technical owner
        required: false
        type: string
      costCentre:
        description: Cost centre
        required: false
        type: string
      budget:
        description: Budget amount
        required: false
        type: string
      durationDays:
        description: Subscription duration in days
        required: false
        default: '30'
        type: string
      statusCallbackUrl:
        description: Logic App callback URL for final plan status
        required: true
        type: string
      terraformOperation:
        description: Terraform operation to execute
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        id: terraform_plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -var="tenant_id=${{ inputs.tenantId }}" \
            -var="azure_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="subscription_name=${{ inputs.projectName }}" \
            -var="subscription_alias=${{ inputs.projectName }}" \
            -var="billing_scope_id=${{ inputs.billingScopeId }}" \
            -var="management_group_id=${{ inputs.managementGroupId }}" \
            -var="project_name=${{ inputs.projectName }}" \
            -var="business_owner=${{ inputs.businessOwner || vars.BUSINESS_OWNER || 'Platform Team' }}" \
            -var="technical_owner=${{ inputs.technicalOwner || vars.TECHNICAL_OWNER || 'Cloud Platform Team' }}" \
            -var="cost_centre=${{ inputs.costCentre || vars.COST_CENTRE || 'CC-0000' }}" \
            -var="environment=${{ inputs.environment }}" \
            -var="location=${{ inputs.region }}" \
            -var="tags={\"request-id\":\"${{ inputs.requestId }}\",\"managed-by\":\"logic-app\",\"business-unit\":\"${{ inputs.businessUnit }}\",\"business-owner\":\"${{ inputs.businessOwner }}\",\"technical-owner\":\"${{ inputs.technicalOwner }}\"}" \
            -out=terraform.tfplan 2>plan-error.txt

      - name: Terraform apply
        id: terraform_apply
        if: ${{ inputs.terraformOperation == 'apply' && steps.terraform_plan.outcome == 'success' }}
        working-directory: terraform
        run: terraform apply -input=false -auto-approve terraform.tfplan 2>apply-error.txt

      - name: Report result to Logic App
        if: always()
        env:
          STATUS_CALLBACK_URL: ${{ inputs.statusCallbackUrl }}
          OPERATION: ${{ inputs.terraformOperation }}
          PLAN_OUTCOME: ${{ steps.terraform_plan.outcome }}
          APPLY_OUTCOME: ${{ steps.terraform_apply.outcome }}
        run: |
          status="Succeeded"
          outcome="$PLAN_OUTCOME"
          error_file="terraform/plan-error.txt"
          if [ "$OPERATION" = "apply" ]; then
            outcome="$APPLY_OUTCOME"
            error_file="terraform/apply-error.txt"
          fi
          if [ "$outcome" != "success" ]; then status="Failed"; fi
          subscription_id=""
          if [ "$OPERATION" = "apply" ] && [ "$status" = "Succeeded" ]; then
            subscription_id=$(terraform -chdir=terraform output -raw subscription_id 2>/dev/null || true)
          fi
          error_message=""
          if [ -f "$error_file" ]; then error_message=$(tr '\n' ' ' < "$error_file"); fi
          jq -n \
            --arg requestId "${{ inputs.requestId }}" \
            --arg projectName "${{ inputs.projectName }}" \
            --arg environment "${{ inputs.environment }}" \
            --arg managementGroupId "${{ inputs.managementGroupId }}" \
            --arg billingScopeId "${{ inputs.billingScopeId }}" \
            --arg region "${{ inputs.region }}" \
            --arg tenantId "${{ inputs.tenantId }}" \
            --arg terraformOperation "$OPERATION" \
            --arg businessUnit "${{ inputs.businessUnit }}" \
            --arg businessOwner "${{ inputs.businessOwner }}" \
            --arg technicalOwner "${{ inputs.technicalOwner }}" \
            --arg costCentre "${{ inputs.costCentre }}" \
            --arg budget "${{ inputs.budget }}" \
            --arg durationDays "${{ inputs.durationDays }}" \
            --arg status "$status" \
            --arg planSummary "Terraform $OPERATION outcome: $outcome" \
            --arg error "$error_message" \
            --arg subscriptionId "$subscription_id" \
            '{requestId:$requestId,projectName:$projectName,environment:$environment,managementGroupId:$managementGroupId,billingScopeId:$billingScopeId,region:$region,tenantId:$tenantId,businessUnit:$businessUnit,businessOwner:$businessOwner,technicalOwner:$technicalOwner,costCentre:$costCentre,budget:(if $budget == "" then 0 else ($budget|tonumber) end),durationDays:(if $durationDays == "" then 30 else ($durationDays|tonumber) end),terraformOperation:$terraformOperation,status:$status,planSummary:$planSummary,error:$error,subscriptionId:$subscriptionId}' \
            | curl --fail-with-body -X POST "$STATUS_CALLBACK_URL" -H "Content-Type: application/json" --data-binary @-

      - name: Publish Terraform plan summary
        if: always()
        run: |
          echo "Request ID: ${{ inputs.requestId }}"
          echo "Project: ${{ inputs.projectName }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Management Group: ${{ inputs.managementGroupId }}"
          echo "Billing Scope: ${{ inputs.billingScopeId }}"
          echo "Region: ${{ inputs.region }}"
          echo "Terraform ${{ inputs.terraformOperation }} outcome: ${{ steps.terraform_apply.outcome || steps.terraform_plan.outcome }}"
