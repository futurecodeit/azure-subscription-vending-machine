name: Azure Subscription Vending - Terraform Plan

on:
  workflow_dispatch:
    inputs:
      requestId:
        description: Subscription vending request ID
        required: true
        type: string
      projectName:
        description: Project or application name
        required: true
        type: string
      environment:
        description: Environment
        required: true
        type: string
      managementGroupId:
        description: Management Group ID
        required: true
        type: string
      billingScopeId:
        description: Billing scope ID
        required: true
        type: string
      region:
        description: Azure region
        required: true
        type: string
      tenantId:
        description: Tenant ID
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -var="tenant_id=${{ inputs.tenantId }}" \
            -var="azure_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="subscription_name=${{ inputs.projectName }}" \
            -var="subscription_alias=${{ inputs.projectName }}" \
            -var="billing_scope_id=${{ inputs.billingScopeId }}" \
            -var="management_group_id=${{ inputs.managementGroupId }}" \
            -var="project_name=${{ inputs.projectName }}" \
            -var="business_owner=${{ vars.BUSINESS_OWNER || 'Platform Team' }}" \
            -var="technical_owner=${{ vars.TECHNICAL_OWNER || 'Cloud Platform Team' }}" \
            -var="cost_centre=${{ vars.COST_CENTRE || 'CC-0000' }}" \
            -var="environment=${{ inputs.environment }}" \
            -var="location=${{ inputs.region }}" \
            -var="tags={\"request-id\":\"${{ inputs.requestId }}\",\"managed-by\":\"logic-app\"}"

      - name: Publish Terraform plan summary
        if: always()
        run: |
          echo "Request ID: ${{ inputs.requestId }}"
          echo "Project: ${{ inputs.projectName }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Management Group: ${{ inputs.managementGroupId }}"
          echo "Billing Scope: ${{ inputs.billingScopeId }}"
          echo "Region: ${{ inputs.region }}"
          echo "Terraform Plan executed successfully."
